<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lightning Pong Launch Gate</title><link rel="stylesheet" href="../styles.css"></head><body><main class="callback-shell"><img src="../assets/lp-mark.svg" alt="Lightning Pong"><p class="eyebrow">Flash Campaign arena</p><h1 id="gateTitle">Checking the launch clock…</h1><p id="gateMessage">Official prize play opens November 14, 2026 at 3:00 PM Eastern Time.</p><a id="gateAction" class="button primary" href="../campaign.html">View Flash Campaign</a></main><script>(()=>{const start=Date.parse('2026-11-14T15:00:00-05:00'),params=location.search;if(Date.now()>=start){location.replace('./app/index.html'+params);return}const el=document.querySelector('#gateTitle'),msg=document.querySelector('#gateMessage');function tick(){const d=Math.max(0,start-Date.now()),h=Math.floor(d/36e5),m=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);el.textContent=`${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;msg.textContent='The arena is locked until the same starting line opens for everyone.'}tick();setInterval(tick,1000)})()</script></body></html>
