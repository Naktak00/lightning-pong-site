<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lightning Pong Launch Gate</title><link rel="stylesheet" href="../styles.css"></head><body><main class="callback-shell"><img src="../assets/lp-mark.svg" alt="Lightning Pong"><p class="eyebrow">Flash Campaign arena</p><h1 id="gateTitle">Checking the launch clock…</h1><p id="gateMessage">Official prize play opens November 14, 2026 at 3:00 PM Eastern Time.</p><a id="gateAction" class="button primary" href="../campaign.html">View Flash Campaign</a></main><script>
(() => {
  const opensAt = Date.parse('2026-11-14T15:00:00-05:00');
  const title = document.querySelector('#gateTitle');
  const message = document.querySelector('#gateMessage');
  function tick() {
    const remaining = opensAt - Date.now();
    if (remaining <= 0) {
      location.replace('./app/index.html' + location.search + location.hash);
      return false;
    }
    const seconds = Math.ceil(remaining / 1000);
    const totalMinutes = Math.floor(seconds / 60);
    title.textContent = Math.floor(totalMinutes / 60) + 'h ' +
      String(totalMinutes % 60).padStart(2, '0') + 'm ' +
      String(seconds % 60).padStart(2, '0') + 's';
    message.textContent = 'The arena is locked until the same starting line opens for everyone.';
    return true;
  }
  if (tick()) {
    const timer = setInterval(() => {
      if (!tick()) clearInterval(timer);
    }, 1000);
  }
})();
</script></body></html>
