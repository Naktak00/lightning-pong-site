<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" role="img" aria-labelledby="title desc">
  <title id="title">Lightning Pong player promise</title>
  <desc id="desc">Nine arcade levels, offline play after installation, and no advertising.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11243a"/>
      <stop offset="1" stop-color="#091525"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18304a" stop-opacity="0"/>
      <stop offset=".52" stop-color="#18304a" stop-opacity=".3"/>
      <stop offset="1" stop-color="#18304a" stop-opacity="0"/>
    </linearGradient>
    <filter id="yellowGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x=".75" y=".75" width="718.5" height="168.5" rx="20" fill="url(#panel)" stroke="#2b4665" stroke-width="1.5"/>
  <path d="M245 34c55-18 118-12 164-25 47-13 84-11 125 6 44 18 91 9 151-8v35c-60 15-105 22-151 7-42-14-79-13-126 1-48 14-108 14-163 30z" fill="url(#wave)"/>
  <path d="M259 33v110M480 33v110" stroke="#7890a8" stroke-width=".8" opacity=".78"/>

  <g aria-label="Nine levels">
    <path d="M43 51h25L55 79h21l-39 42 13-33H27z" fill="#ffd84d" filter="url(#yellowGlow)"/>
    <circle cx="78" cy="65" r="7" fill="#ff3f6e"/>
    <circle cx="80" cy="103" r="7" fill="#45a3ff"/>
    <text x="105" y="79" fill="#edf6ff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800">9 LEVELS</text>
    <text x="105" y="103" fill="#a9bdd2" font-family="Arial,Helvetica,sans-serif" font-size="14">Arcade campaign</text>
  </g>

  <g aria-label="Offline play">
    <path d="M286 86l13 13 30-35" fill="none" stroke="#edf6ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="350" y="77" fill="#edf6ff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800">OFFLINE</text>
    <text x="350" y="102" fill="#a9bdd2" font-family="Arial,Helvetica,sans-serif" font-size="14">Play after install</text>
  </g>

  <g aria-label="No ads">
    <rect x="500" y="47" width="76" height="58" rx="9" fill="none" stroke="#45a3ff" stroke-width="6"/>
    <text x="538" y="86" text-anchor="middle" fill="#edf6ff" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="900">AD</text>
    <path d="M501 111l78-70" stroke="#ff3f6e" stroke-width="9" stroke-linecap="round" filter="url(#pinkGlow)"/>
    <text x="592" y="72" fill="#edf6ff" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800">NO ADS</text>
    <text x="592" y="98" fill="#a9bdd2" font-family="Arial,Helvetica,sans-serif" font-size="14">Just the game</text>
  </g>
</svg>
