<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Opening Passport | Lightning Pong</title><link rel="stylesheet" href="styles.css"></head><body><main class="callback-shell"><img src="assets/lp-mark.svg" alt="Lightning Pong"><p class="eyebrow">Player Passport</p><h1 id="callbackTitle">Opening your Passport…</h1><p id="callbackMessage">Securely completing sign-in.</p><a class="button primary" href="account.html">Continue to Passport</a></main><script src="vendor/supabase.js"></script><script src="supabase-config.js"></script><script src="site-auth.js"></script><script>setTimeout(async()=>{if(!window.LPAuth?.client){callbackTitle.textContent='Passport connection unavailable.';callbackMessage.textContent='Return to the Player Passport and try again later.';return}const {data:{session},error}=await LPAuth.client.auth.getSession();if(error||!session){callbackTitle.textContent='Sign-in could not be completed.';callbackMessage.textContent=error?.message||'The link may have expired.';return}callbackTitle.textContent='Passport opened.';callbackMessage.textContent='Returning you to your private player page…';setTimeout(()=>location.replace('account.html'+location.search),900)},150)</script></body></html>
